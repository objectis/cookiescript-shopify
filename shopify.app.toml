# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "444619ca3904f79f338f460150e1fd17"
name = "CookieScript"
application_url = "https://sapp.cookie-script.com/"
embedded = true
handle = "cookiescript"

[webhooks]
api_version = "2023-01"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://sapp.cookie-script.com/auth/callback",
  "https://sapp.cookie-script.com/auth/shopify/callback",
  "https://sapp.cookie-script.com/api/auth/callback"
]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
